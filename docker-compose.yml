version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./data/analysis.db
      - REPOS_YAML_PATH=/app/repos.yaml
      - API_KEY=${API_KEY:-changeme-secret-key}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-60}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-60}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-300}
      - DB_BACKUP_DIR=/app/data/backups
    volumes:
      - backend_data:/app/data
      - ${REPOS_MOUNT_PATH:-./backend/repos.yaml.example}:/app/repos.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./data/analysis.db
      - DB_BACKUP_DIR=/app/data/backups
    volumes:
      - backend_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app:celery_app worker --loglevel=info --concurrency=2

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./data/analysis.db
      - DB_BACKUP_DIR=/app/data/backups
    volumes:
      - backend_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app:celery_app beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - fastapi

volumes:
  redis_data:
  backend_data:
