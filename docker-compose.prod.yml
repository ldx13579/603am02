version: "3.9"

services:
  redis:
    restart: unless-stopped

  postgres:
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

  fastapi:
    restart: unless-stopped
    ports: []
    environment:
      - DINGTALK_WEBHOOK_URL=${DINGTALK_WEBHOOK_URL:-}
      - RULE_ENABLED=${RULE_ENABLED:-true}
      - RULE_MAX_FILES_PER_COMMIT=${RULE_MAX_FILES_PER_COMMIT:-20}
      - RULE_MIN_MESSAGE_LENGTH=${RULE_MIN_MESSAGE_LENGTH:-5}
      - RULE_MAX_LINES_CHANGED=${RULE_MAX_LINES_CHANGED:-1000}
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:8000/api/health'); r.raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  celery-worker:
    restart: unless-stopped
    environment:
      - DINGTALK_WEBHOOK_URL=${DINGTALK_WEBHOOK_URL:-}
      - RULE_ENABLED=${RULE_ENABLED:-true}
      - RULE_MAX_FILES_PER_COMMIT=${RULE_MAX_FILES_PER_COMMIT:-20}
      - RULE_MIN_MESSAGE_LENGTH=${RULE_MIN_MESSAGE_LENGTH:-5}
      - RULE_MAX_LINES_CHANGED=${RULE_MAX_LINES_CHANGED:-1000}

  celery-beat:
    restart: unless-stopped

  frontend:
    restart: unless-stopped
    ports: []

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - fastapi
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  default:
    name: githabits-network
